schema_version: "1.0"
template_id: inventory_feedback
name: 样机盘点反馈
description: 按日期抓取样机盘点记录并下载盘点凭证
status: published
version: 1
system:
  entry_url: https://example.internal/
  preferred_tab_url_contains: example.internal
  allowed_hosts:
    - example.internal
auth:
  strategy: reuse_current_chrome_session
  login_check:
    any:
      - url_contains: /home
      - semantic_element: 退出登录
  unauthenticated_signals:
    - semantic_element: 用户名
    - semantic_element: 登录
variables:
  date:
    type: date
    required: true
    default: yesterday
    prompt: 请输入要抓取的日期
  owner:
    type: string
    required: false
    prompt: 是否限制挂账人？不填则全部
target:
  record_key:
    - sn
  fields:
    - key: sample_id
      name: 样机ID
      type: string
      required: true
      semantic: [样机ID, 设备ID]
      source: list
    - key: sn
      name: SN
      type: string
      required: true
      semantic: [SN, 序列号]
      source: list
    - key: product_model
      name: 产品型号
      type: string
      required: false
      semantic: [产品型号, 型号]
      source: list
  attachments:
    - key: inventory_evidence
      name: 盘点凭证
      required: false
      semantic: [凭证, 附件, 证明]
      source: detail
      per_record: true
      file_types: [pdf, jpg, jpeg, png, xlsx]
      filename_pattern: "{sn}_{original_name}"
      destination_subdir: attachments/evidence
  pagination:
    strategy: none
workflow:
  hints:
    - action: ensure_page
      target: 盘点反馈
    - action: set_filter
      target: 日期
      value: "${date}"
    - action: query
      target: 查询
  iterate_detail_if_needed: true
learned:
  page_hints: []
  field_mappings: {}
  attachment_mappings: {}
  validated_at: null
validation:
  required_fields_complete: true
  pagination_complete: true
  downloads_complete_for_required: true
  unique_record_keys: true
  min_records: 0
output:
  format: both
  columns: [sample_id, sn, product_model]
  filename_pattern: "inventory_feedback_{date}"
  attachments_dir: attachments
  include_source_metadata: true

